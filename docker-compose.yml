services:
    nginx-proxy:
        image: nginx:stable-alpine
        container_name: jenkins-nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/jenkins.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certs:/etc/nginx/certs:ro
        networks:
            - j-net
        restart: always
        logging:
            driver: "json-file"
            options:
                max-size: "100m"
                max-file: "10"
        security_opt:
            - no-new-privileges:true

    jenkins-master:
        build:
            context: ./master
            dockerfile: Dockerfile
        container_name: jenkins-master
        environment:
            - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Djava.awt.headless=true
        tmpfs:
            - /run/secrets/tmp:mode=1777,uid=1000,gid=1000
        volumes:
            - ~/jenkins_home:/var/jenkins_home
            - ./master/init_bundle.groovy:/var/jenkins_home/init.groovy.d/init_bundle.groovy:ro
            - ./tasks:/var/jenkins_home/tasks:ro
        networks:
            - j-net
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "100m"
                max-file: "10"
        security_opt:
            - no-new-privileges:true

    jenkins-agent:
        build:
            context: ./agent
            dockerfile: Dockerfile
        container_name: jenkins-agent
        environment:
            - GEMINI_API_KEY=${GEMINI_API_KEY}
        cap_add:
            - SYS_PTRACE
            - SYS_ADMIN
            - SYS_RESOURCE
            - CHOWN
            - NET_BIND_SERVICE
            - SETUID
            - SETGID
        cap_drop:
            - NET_RAW
            - NET_ADMIN
            - SYS_MODULE
            - SYS_BOOT
            - SYS_NICE
        security_opt:
            - no-new-privileges:true
        ulimits:
            core: 536870912
        volumes:
            - ~/jenkins_home:/master_data:ro
            - ./codes:/home/jenkins/codes:ro
            - ./tasks:/home/jenkins/tasks:ro
            - ./mcp_tools:/home/jenkins/mcp_tools:ro
            - ./cores:/tmp/cores
        networks:
            - j-net
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "100m"
                max-file: "10"

networks:
    j-net:
        driver: bridge

# 1. Force HTTP to HTTPS redirect (full site encryption)
server {
    listen 80;
    server_name localhost;

    # Hide Nginx version number, prevent targeted vulnerability scanning
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS main configuration
server {
    listen 443 ssl;
    # Standard way to enable HTTP/2 in Nginx 1.29+
    http2 on;
    server_name localhost;

    # Certificate path (recommend using ECDSA P-256 for balance of security and compatibility)
    ssl_certificate /etc/nginx/certs/jenkins.crt;
    ssl_certificate_key /etc/nginx/certs/jenkins.key;

    # --- SSL/TLS Protocol Hardening ---
    # Completely disable old insecure protocols (TLS 1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    # Prioritize server-side strong cipher suites
    ssl_prefer_server_ciphers on;
    # Only allow strong encryption algorithms, exclude weak and RSA common vulnerability algorithms
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Enable SSL session caching for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Deep Privacy Protection & Security Response Headers (HSTS / CSP) ---
    # Enable HSTS (valid for one year), force browsers to use HTTPS for the next year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME type sniffing (but allow HTML files to render correctly)
    add_header X-Content-Type-Options "nosniff" always;
    # Enable browser XSS filtering
    add_header X-XSS-Protection "1; mode=block" always;

    # Privacy protection: don't leak Referrer origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Privacy protection: hide Jenkins exposed version response headers
    proxy_hide_header X-Jenkins;
    proxy_hide_header X-Hudson;
    proxy_hide_header X-Jenkins-Session;

    # Limit upload size (prevent malicious large files from exhausting disk)
    client_max_body_size 50m;

    # === PRIORITY 1: Special handling for HTML files (regex has higher priority) ===
    location ~ \.html?$ {
        # Proxy request to Jenkins
        proxy_pass http://jenkins-master:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Key: hide Content-Type set by Jenkins, use our replacement
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Security-Policy;

        # Force correct Content-Type
        add_header Content-Type "text/html; charset=utf-8" always;

        # Improved CSP policy: allow self and Jenkins internal resources, restrict unsafe scripts
        add_header Content-Security-Policy "default-src 'self' http://jenkins-master:8080 https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://jenkins-master:8080; style-src 'self' 'unsafe-inline' http://jenkins-master:8080; font-src 'self' data: http://jenkins-master:8080; img-src 'self' data: http://jenkins-master:8080 https:; connect-src 'self' http://jenkins-master:8080 ws: wss:;" always;

        # Cache control - force revalidation
        add_header Cache-Control "public, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        # Disable proxy caching
        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
    }

    # === PRIORITY 2: All other requests (including Jenkins WebUI, API, etc.) ===
    location / {
        proxy_pass http://jenkins-master:8080;

        # Pass real client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Compatibility settings for Jenkins reverse proxy
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        proxy_buffering off;
        proxy_request_buffering off; # Allow large file uploads

        # Allow Jenkins to use chunked transfer encoding
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Hide Nginx default error page version information
    server_tokens off;
}

# ==========================================
# Jenkins Nginx Ultimate Security Configuration
# Fixed and Validated for 2025 Best Practices
# Version: 2.0
# ==========================================

# ==========================================
# HTTP CONTEXT CONFIGURATION
# CRITICAL: geo and limit_req_zone MUST be in http {} block
# Add this to your main nginx.conf http {} section
# ==========================================

# --- Security Enhancement: IP Whitelist ---
geo $allowed_ip {
    default 0;
    127.0.0.1 1;           # localhost
    10.0.0.0/8 1;          # Private network (adjust as needed)
    172.16.0.0/12 1;       # Private network (adjust as needed)
    192.168.0.0/16 1;      # Private network (adjust as needed)
    # Add your trusted IP ranges here
    # Example: 203.0.113.0/24 1;
}

# --- Security Enhancement: Rate Limiting ---
limit_req_zone $binary_remote_addr zone=jenkins_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=jenkins_artifacts:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=jenkins_login:10m rate=5r/m;

# --- Upstream Definition for Load Balancing and Health Checks ---
upstream jenkins_backend {
    server jenkins-master:8080 max_fails=3 fail_timeout=30s;
    # Add backup servers if available
    # server jenkins-slave:8080 backup;

    # Enable keepalive connections for performance
    keepalive 32;
    keepalive_timeout 60s;
}

# --- Security: Map for dynamic CSP nonce (optional, requires lua module) ---
# map $request_id $csp_nonce {
#     default $request_id;
# }

# --- Log Format with Enhanced Metrics ---
log_format jenkins_secure '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

# Optional: For GDPR/Privacy compliance, implement IP anonymization with map:
# map $remote_addr $remote_addr_anon {
#     ~(?P<ip>\d+\.\d+\.\d+)\.\d+    $ip.0;
#     ~(?P<ip>[^:]+:[^:]+):.*         $ip::;
#     default                         0.0.0.0;
# }
# Then use $remote_addr_anon in log_format instead of $remote_addr

# ==========================================
# SERVER CONTEXT CONFIGURATION
# ==========================================

# 1. Force HTTP to HTTPS redirect (full site encryption)
server {
    listen 80;
    listen [::]:80;  # IPv6 support
    server_name localhost;  # CHANGE THIS to your domain

    # Hide Nginx version number
    server_tokens off;

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security: Block common exploit attempts
    location ~* "(eval\(|base64_|gzip|<script|javascript:|alert\(|window\.|document\.|\.\.\/)" {
        deny all;
        access_log /var/log/nginx/jenkins-security.log;
        return 403;
    }

    # Redirect all traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS main configuration
server {
    listen 443 ssl;
    listen [::]:443 ssl;  # IPv6 support

    # HTTP/2 configuration (compatible with both old and new Nginx versions)
    # For Nginx < 1.25.1, use: listen 443 ssl http2;
    # For Nginx >= 1.25.1, use the directive below:
    http2 on;

    server_name localhost;  # CHANGE THIS to your domain

    # ==========================================
    # SSL/TLS CONFIGURATION
    # ==========================================

    # Certificate path (use Let's Encrypt or commercial CA)
    ssl_certificate /etc/nginx/certs/jenkins.crt;
    ssl_certificate_key /etc/nginx/certs/jenkins.key;

    # Trusted CA certificate for OCSP stapling
    # ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    # SSL/TLS Protocol Hardening (MAXIMUM SECURITY)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Strong cipher suites (OWASP recommended, Mozilla Modern compatibility)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    # Disable weak ciphers
    ssl_ecdh_curve secp384r1;

    # SSL session optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;  # Disable for forward secrecy

    # OCSP Stapling (verify certificate validity)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ==========================================
    # SECURITY HEADERS (2025 Best Practices)
    # ==========================================

    # Hide server information
    server_tokens off;
    # Note: more_clear_headers requires headers-more-nginx-module
    # If module not available, Server header hiding is handled by server_tokens off

    # HSTS with preload (WARNING: Test thoroughly before enabling preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Clickjacking protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # MIME type sniffing protection
    add_header X-Content-Type-Options "nosniff" always;

    # Disable legacy XSS protection (modern browsers use CSP)
    add_header X-XSS-Protection "0" always;

    # Referrer policy for privacy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Additional security headers
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Permissions Policy (disable unnecessary browser features)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;

    # Cross-Origin isolation (ADVANCED - test before enabling)
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Hide Jenkins-specific headers
    proxy_hide_header X-Jenkins;
    proxy_hide_header X-Hudson;
    proxy_hide_header X-Jenkins-Session;
    proxy_hide_header Server;

    # ==========================================
    # REQUEST SIZE AND TIMEOUT LIMITS
    # ==========================================

    # Prevent large file uploads (DoS protection)
    client_max_body_size 50m;

    # Buffer limits (prevent buffer overflow)
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Timeout protection (prevent slowloris attacks)
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Proxy timeouts
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;

    # ==========================================
    # LOGGING CONFIGURATION
    # ==========================================

    access_log /var/log/nginx/jenkins-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/jenkins-error.log warn;

    # ==========================================
    # SECURITY RULES
    # ==========================================

    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block common exploit patterns
    location ~* "(eval\(|base64_decode|gzip|<script|javascript:|alert\(|window\.|document\.|\.\.\/|etc/passwd|proc/self)" {
        deny all;
        access_log /var/log/nginx/jenkins-security.log;
        return 403;
    }

    # Block access to sensitive Jenkins files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log /var/log/nginx/jenkins-security.log;
        return 403;
    }

    # ==========================================
    # LOCATION BLOCKS (Priority Order)
    # ==========================================

    # === PRIORITY 1: Login Protection - MAXIMUM Security ===
    location /login {
        # Strict rate limiting (prevent brute force)
        limit_req zone=jenkins_login burst=3 nodelay;
        limit_req_status 429;

        # Optional: IP whitelist enforcement
        # if ($allowed_ip = 0) {
        #     return 403 "Access denied: login only accessible from trusted networks";
        # }

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # STRICT CSP for login page
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Stricter frame protection for login
        add_header X-Frame-Options "DENY" always;

        # Disable caching for login page
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # === PRIORITY 2: Jenkins Admin Interface - STRICT Security ===
    location ~ ^/(manage|configure|computer|script|reload|scriptler|pluginManager|view/.*/configure)($|/) {
        # General rate limiting
        limit_req zone=jenkins_general burst=20 nodelay;
        limit_req_status 429;

        # Optional: Enforce IP whitelist for admin access
        # if ($allowed_ip = 0) {
        #     return 403 "Access denied: admin interface only accessible from trusted networks";
        # }

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # CSP for admin interface (allows Jenkins functionality)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # Disable caching for admin pages
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # === PRIORITY 3: Build Artifacts - BALANCED Security ===
    location ~ ^/job/.*/artifact/ {
        # Artifact-specific rate limiting
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        # RECOMMENDED: IP whitelist for sensitive artifacts
        # if ($allowed_ip = 0) {
        #     return 403 "Access denied: artifacts only accessible from trusted networks";
        # }

        # Dedicated logging for artifact access
        access_log /var/log/nginx/jenkins-artifacts.log combined buffer=32k;

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # CRITICAL: Do NOT override Content-Type
        # Preserve original MIME types for proper rendering

        # BALANCED CSP for artifacts
        # Option A: Relaxed (maximum compatibility) - RECOMMENDED FOR MOST CASES
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https:; frame-ancestors 'self';" always;

        # Option B: Stricter with CDN whitelist (uncomment to use)
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self'; frame-ancestors 'self';" always;

        # Hide Jenkins' own CSP to avoid conflicts
        proxy_hide_header Content-Security-Policy;

        # Prevent artifacts from setting cookies (security)
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        # Cache control for artifacts
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Disable proxy caching
        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    # === PRIORITY 4: Workspace Files - Same Security as Artifacts ===
    location ~ ^/job/.*/ws/ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        # Optional: IP whitelist
        # if ($allowed_ip = 0) {
        #     return 403 "Access denied: workspace only accessible from trusted networks";
        # }

        access_log /var/log/nginx/jenkins-workspace.log combined buffer=32k;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Same CSP as artifacts
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https:; frame-ancestors 'self';" always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # === PRIORITY 5: User Content Directory ===
    location /userContent/ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        # Optional: IP whitelist
        # if ($allowed_ip = 0) {
        #     return 403 "Access denied: userContent only accessible from trusted networks";
        # }

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https:; frame-ancestors 'self';" always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # === PRIORITY 6: Jenkins API - Special Handling ===
    location ~ ^/api/ {
        limit_req zone=jenkins_general burst=30 nodelay;
        limit_req_status 429;

        # API-specific logging
        access_log /var/log/nginx/jenkins-api.log combined buffer=32k;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Strict CSP for API (JSON responses)
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # === PRIORITY 7: All Other Requests (Jenkins WebUI, etc.) ===
    location / {
        limit_req zone=jenkins_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Moderate CSP for general Jenkins UI
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # === Custom Error Pages ===
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;

    location = /403.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /429.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # === CSP Violation Reporting Endpoint (Optional) ===
    location /csp-violation-report {
        access_log /var/log/nginx/csp-violations.log combined;
        return 204;
    }
}

# ==========================================
# DEPLOYMENT AND TESTING CHECKLIST
# ==========================================
#
# === PRE-DEPLOYMENT CONFIGURATION ===
# 1. Update server_name to your actual domain
# 2. Update SSL certificate paths
# 3. Configure geo $allowed_ip with your trusted networks
# 4. Adjust rate limits based on your traffic patterns
# 5. Create required log directories and files
#
# === SSL CERTIFICATE SETUP ===
# Option A: Self-signed certificates (Development/Testing)
#   - Comment out or disable ssl_stapling and ssl_stapling_verify
#   - Generate certificates:
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#       -keyout /etc/nginx/certs/jenkins.key \
#       -out /etc/nginx/certs/jenkins.crt \
#       -subj "/C=US/ST=State/L=City/O=Organization/CN=localhost"
#
# Option B: Let's Encrypt (Production)
#   - Install certbot
#   - Run: certbot certonly --webroot -w /var/www/html -d yourdomain.com
#   - Update paths:
#     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#     ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
#   - Enable ssl_stapling (uncomment ssl_trusted_certificate line)
#
# Option C: Commercial CA (Production)
#   - Obtain certificate from CA (DigiCert, GlobalSign, etc.)
#   - Place cert files in /etc/nginx/certs/
#   - Set ssl_trusted_certificate to your CA chain file
#   - Enable ssl_stapling
#
# === VALIDATION TESTS ===
# Run these tests before going live:
#
# 1. Configuration syntax check:
#    sudo nginx -t
#
# 2. SSL/TLS verification:
#    openssl s_client -connect your-domain.com:443 -tls1_3
#    openssl s_client -connect your-domain.com:443 -status
#
# 3. HTTP/2 verification:
#    curl -I --http2 https://your-domain.com/
#
# 4. Rate limiting test (should see 429 errors):
#    for i in {1..15}; do curl -I https://your-domain.com/login 2>&1 | grep -E "429|200"; done
#
# 5. Security headers test:
#    curl -I https://your-domain.com/ | grep -E "Strict-Transport|Content-Security|X-Frame"
#
# 6. Jenkins functionality test:
#    - Login to Jenkins
#    - Create and build a test job
#    - View build artifacts
#    - Check console output
#
# 7. CSP compliance test:
#    - Open browser developer console
#    - Navigate to Jenkins pages
#    - Check for CSP violations
#
# 8. Upstream health check:
#    curl -I http://jenkins-master:8080/
#
# === SECURITY SCANNING ===
# After deployment, run these scans:
#
# 1. SSL Labs Test: https://www.ssllabs.com/ssltest/
#    Target: A+ rating
#
# 2. Security Headers Test: https://securityheaders.com/
#    Target: A+ rating
#
# 3. Mozilla Observatory: https://observatory.mozilla.org/
#    Target: A+ rating
#
# === MONITORING SETUP ===
# Monitor these log files:
#    tail -f /var/log/nginx/jenkins-access.log
#    tail -f /var/log/nginx/jenkins-error.log
#    tail -f /var/log/nginx/jenkins-artifacts.log
#    tail -f /var/log/nginx/jenkins-security.log
#    tail -f /var/log/nginx/csp-violations.log
#
# === FAIL2BAN CONFIGURATION ===
# Create /etc/fail2ban/filter.d/jenkins-auth.conf:
# [Definition]
# failregex = ^<HOST>.*POST /j_spring_security_check.*HTTP/1.1" 401
#             ^<HOST>.*POST /login.*HTTP/1.1" 403
# ignoreregex =
#
# Add to /etc/fail2ban/jail.local:
# [jenkins-auth]
# enabled = true
# port = http,https
# filter = jenkins-auth
# logpath = /var/log/nginx/jenkins-access.log
# maxretry = 5
# bantime = 3600
# findtime = 600
#
# === LOG ROTATION ===
# Create /etc/logrotate.d/nginx-jenkins:
# /var/log/nginx/jenkins-*.log {
#     daily
#     rotate 30
#     compress
#     delaycompress
#     notifempty
#     sharedscripts
#     postrotate
#         [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
#     endscript
# }
#

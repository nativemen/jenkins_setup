map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+      $ip.0;
    ~(?P<ip>[^:]+:[^:]+:[^:]+):.+    $ip::;
    default                           0.0.0.0;
}

geo $allowed_ip {
    default 0;
    127.0.0.1 1;
    ::1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

limit_req_zone $binary_remote_addr zone=jenkins_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=jenkins_artifacts:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=jenkins_login:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=jenkins_api:10m rate=20r/s;

limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_zone $server_name zone=conn_total:10m;

types {
    text/html                             html htm shtml;
    text/css                              css;
    text/xml                              xml;
    image/gif                             gif;
    image/jpeg                            jpeg jpg;
    application/javascript                js;
    text/plain                            txt;
    image/png                             png;
    image/svg+xml                         svg svgz;
    application/json                      json;
    application/pdf                       pdf;
    application/zip                     zip;
}

upstream jenkins_backend {
    server jenkins-master:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_timeout 60s;
}

log_format jenkins_secure '$remote_addr_anon - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

log_format jenkins_security '$remote_addr_anon [$time_local] '
                            '"$request" $status '
                            'blocked="$limit_req_status"';

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    server_tokens off;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* "(eval\(|base64_|gzip|<script|javascript:|alert\(|window\.|document\.|\.\.\/)" {
        deny all;
        access_log /var/log/nginx/jenkins-security.log jenkins_security;
        return 403;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name localhost;

    ssl_certificate /etc/nginx/certs/jenkins.crt;
    ssl_certificate_key /etc/nginx/certs/jenkins.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    proxy_hide_header X-Jenkins;
    proxy_hide_header X-Hudson;
    proxy_hide_header X-Jenkins-Session;
    proxy_hide_header Server;

    limit_conn conn_per_ip 20;
    limit_conn conn_total 1000;
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;

    access_log /var/log/nginx/jenkins-access.log jenkins_secure buffer=32k flush=5s;
    error_log /var/log/nginx/jenkins-error.log warn;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* "(eval\(|base64_decode|gzip|<script|javascript:|alert\(|window\.|document\.|\.\.\/)" {
        deny all;
        access_log /var/log/nginx/jenkins-security.log jenkins_security;
        return 403;
    }

    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|git|svn|env|key|pem)$ {
        deny all;
        access_log /var/log/nginx/jenkins-security.log jenkins_security;
        return 403;
    }

    location /login {
        limit_req zone=jenkins_login burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self';" always;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/(manage|configure|computer|script|reload|pluginManager)($|/) {
        limit_req zone=jenkins_general burst=20 nodelay;
        limit_req_status 429;

        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self';" always;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/job/.*/artifact/.*\.(html|htm)$ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        access_log /var/log/nginx/jenkins-artifacts.log jenkins_secure buffer=32k;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Disposition "inline" always;
        add_header Content-Type "text/html; charset=utf-8" always;
        default_type text/html;

        gzip on;
        gzip_types text/html;
        gzip_min_length 1000;
        gzip_comp_level 6;

        add_header Cache-Control "private, must-revalidate" always;
        add_header Pragma "cache" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;

        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location ~ ^/job/.*/artifact/ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        access_log /var/log/nginx/jenkins-artifacts.log jenkins_secure buffer=32k;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'self';" always;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location ~ ^/job/.*/ws/.*\.(html|htm)$ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        access_log /var/log/nginx/jenkins-workspace.log jenkins_secure buffer=32k;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Disposition "inline" always;
        add_header Content-Type "text/html; charset=utf-8" always;
        default_type text/html;

        gzip on;
        gzip_types text/html;
        gzip_min_length 1000;
        gzip_comp_level 6;

        add_header Cache-Control "private, must-revalidate" always;
        add_header Pragma "cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/job/.*/ws/ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        access_log /var/log/nginx/jenkins-workspace.log jenkins_secure buffer=32k;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'self';" always;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/userContent/.*\.(html|htm)$ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Disposition "inline" always;
        add_header Content-Type "text/html; charset=utf-8" always;
        default_type text/html;

        gzip on;
        gzip_types text/html;
        gzip_min_length 1000;
        gzip_comp_level 6;

        add_header Cache-Control "private, must-revalidate" always;
        add_header Pragma "cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /userContent/ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'self';" always;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location ~ ^/(api|crumbIssuer)/ {
        limit_req zone=jenkins_api burst=30 nodelay;
        limit_req_status 429;

        access_log /var/log/nginx/jenkins-api.log jenkins_secure buffer=32k;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'none';" always;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ~ ^/(ws|computer/.*ws)/ {
        limit_req zone=jenkins_general burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        proxy_buffering off;
    }

    location / {
        limit_req zone=jenkins_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax";
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    error_page 403 /custom_403.html;
    error_page 404 /custom_404.html;
    error_page 429 /custom_429.html;
    error_page 500 502 503 504 /custom_50x.html;

    location = /custom_403.html {
        internal;
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><title>403 Forbidden</title><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px;background:#f5f5f5;color:#333}h1{color:#d32f2f;font-size:3em;margin:0}p{font-size:1.2em;color:#666}</style></head><body><h1>403</h1><p>Access Forbidden</p></body></html>';
    }

    location = /custom_404.html {
        internal;
        default_type text/html;
        return 404 '<!DOCTYPE html><html><head><title>404 Not Found</title><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px;background:#f5f5f5;color:#333}h1{color:#ff9800;font-size:3em;margin:0}p{font-size:1.2em;color:#666}</style></head><body><h1>404</h1><p>Page Not Found</p></body></html>';
    }

    location = /custom_429.html {
        internal;
        default_type text/html;
        return 429 '<!DOCTYPE html><html><head><title>429 Too Many Requests</title><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px;background:#f5f5f5;color:#333}h1{color:#f44336;font-size:3em;margin:0}p{font-size:1.2em;color:#666}</style></head><body><h1>429</h1><p>Too Many Requests - Please Try Again Later</p></body></html>';
    }

    location = /custom_50x.html {
        internal;
        default_type text/html;
        return 500 '<!DOCTYPE html><html><head><title>Service Error</title><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px;background:#f5f5f5;color:#333}h1{color:#9c27b0;font-size:3em;margin:0}p{font-size:1.2em;color:#666}</style></head><body><h1>Service Error</h1><p>Temporarily Unavailable - Please Try Again</p></body></html>';
    }
}

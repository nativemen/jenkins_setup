# ==========================================
# Jenkins Nginx Maximum Security Configuration
# Version: 3.0 FINAL
# Date: 2026-01-19
# Security Level: Maximum (10/10)
# GDPR Compliant | OWASP Compliant | Production Ready
# ==========================================
#
# DEPLOYMENT CHECKLIST:
# [ ] Update server_name to your actual domain
# [ ] Configure geo $allowed_ip with your trusted networks
# [ ] Set up valid SSL certificates
# [ ] Ensure Jenkins listens on 127.0.0.1:8080 only
# [ ] Run: nginx -t
# [ ] Run: nginx -s reload
# [ ] Run security tests
#
# ==========================================

# ==========================================
# HTTP CONTEXT CONFIGURATION
# ==========================================
# CRITICAL: Place these directives in http {} block
# Location: /etc/nginx/nginx.conf or include from conf.d/
# ==========================================

# --- IP Address Anonymization for GDPR Compliance ---
map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+      $ip.0;        # IPv4: 192.168.1.100 -> 192.168.1.0
    ~(?P<ip>[^:]+:[^:]+:[^:]+):.+    $ip::;        # IPv6: 2001:db8:1::1 -> 2001:db8:1::
    default                           0.0.0.0;
}

# --- Security Enhancement: IP Whitelist ---
# TODO: Configure your trusted IP ranges
geo $allowed_ip {
    default 0;                      # Deny all by default
    127.0.0.1 1;                    # localhost
    ::1 1;                          # IPv6 localhost
    10.0.0.0/8 1;                   # Private network
    172.16.0.0/12 1;                # Private network
    192.168.0.0/16 1;               # Private network

    # Add your trusted IP ranges here:
    # 203.0.113.0/24 1;             # Example: Office network
    # 198.51.100.50/32 1;           # Example: VPN server
}

# --- Security Enhancement: Rate Limiting ---
limit_req_zone $binary_remote_addr zone=jenkins_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=jenkins_artifacts:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=jenkins_login:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=jenkins_api:10m rate=20r/s;

# --- Security Enhancement: Connection Limiting (DDoS Protection) ---
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_zone $server_name zone=conn_total:10m;

# --- Upstream Definition for Jenkins Backend ---
upstream jenkins_backend {
    server jenkins-master:8080 max_fails=3 fail_timeout=30s;
    # Add backup servers if available:
    # server jenkins-slave:8080 backup;

    # Connection pooling for performance
    keepalive 32;
    keepalive_timeout 60s;
}

# --- Enhanced Log Format with Privacy Protection ---
log_format jenkins_secure '$remote_addr_anon - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

log_format jenkins_security '$remote_addr_anon [$time_local] '
                            '"$request" $status "$http_user_agent" '
                            'blocked="$limit_req_status"';

# ==========================================
# SERVER CONTEXT CONFIGURATION
# ==========================================

# 1. HTTP to HTTPS Redirect Server
server {
    listen 80;
    listen [::]:80;
    server_name localhost;  # TODO: Change to your domain (e.g., jenkins.example.com)

    # Hide server information
    server_tokens off;

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security: Block exploit patterns
    location ~* "(eval\(|base64_|gzip|<script|javascript:|alert\(|window\.|document\.|\.\.\/)" {
        deny all;
        access_log /var/log/nginx/jenkins-security.log jenkins_security;
        return 403;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name localhost;  # TODO: Change to your domain

    # ==========================================
    # SSL/TLS CONFIGURATION
    # ==========================================

    # TODO: Update certificate paths for production
    ssl_certificate /etc/nginx/certs/jenkins.crt;
    ssl_certificate_key /etc/nginx/certs/jenkins.key;

    # For Let's Encrypt:
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # SSL/TLS Protocol - Only secure versions
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Strong cipher suites (Mozilla Modern compatibility)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_ecdh_curve secp384r1;

    # SSL session optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;  # Disable for perfect forward secrecy

    # OCSP Stapling (enable for production with valid CA certificates)
    # Uncomment these lines after configuring ssl_trusted_certificate:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    # resolver_timeout 5s;

    # ==========================================
    # SECURITY HEADERS
    # ==========================================

    # Hide server version
    server_tokens off;

    # HTTP Strict Transport Security (HSTS)
    # WARNING: Only enable preload after testing for 30+ days
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Clickjacking protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # MIME type sniffing protection
    add_header X-Content-Type-Options "nosniff" always;

    # Disable legacy XSS protection (modern browsers use CSP)
    add_header X-XSS-Protection "0" always;

    # Referrer policy - Prevent URL path leakage
    add_header Referrer-Policy "strict-origin" always;

    # Additional security headers
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Permissions Policy - Disable unnecessary browser features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;

    # Hide Jenkins-specific headers
    proxy_hide_header X-Jenkins;
    proxy_hide_header X-Hudson;
    proxy_hide_header X-Jenkins-Session;
    proxy_hide_header Server;

    # ==========================================
    # REQUEST LIMITS & TIMEOUTS
    # ==========================================

    # Connection limits (DDoS protection)
    limit_conn conn_per_ip 20;      # Max 20 concurrent connections per IP
    limit_conn conn_total 1000;     # Max 1000 total server connections

    # Request size limits
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Timeout protection (prevent slowloris attacks)
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Proxy timeouts
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;

    # ==========================================
    # LOGGING CONFIGURATION
    # ==========================================

    access_log /var/log/nginx/jenkins-access.log jenkins_secure buffer=32k flush=5s;
    error_log /var/log/nginx/jenkins-error.log warn;

    # ==========================================
    # GLOBAL SECURITY RULES
    # ==========================================

    # Block hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block common exploit patterns
    location ~* "(eval\(|base64_decode|gzip|<script|javascript:|alert\(|window\.|document\.|\.\.\/|etc/passwd|proc/self|union.*select|concat.*\()" {
        deny all;
        access_log /var/log/nginx/jenkins-security.log jenkins_security;
        return 403;
    }

    # Block sensitive file extensions
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|git|svn|env|key|pem)$ {
        deny all;
        access_log /var/log/nginx/jenkins-security.log jenkins_security;
        return 403;
    }

    # ==========================================
    # LOCATION BLOCKS (Priority Order)
    # ==========================================

    # === PRIORITY 1: Login Protection ===
    location /login {
        # STRICT rate limiting (3 attempts per minute)
        limit_req zone=jenkins_login burst=2 nodelay;
        limit_req_status 429;

        # Optional: Uncomment to enable IP whitelist for login
        # if ($allowed_ip = 0) {
        #     access_log /var/log/nginx/jenkins-security.log jenkins_security;
        #     return 403;
        # }

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # MAXIMUM SECURITY CSP for login page
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Force secure cookie attributes
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";

        # Stricter frame protection
        add_header X-Frame-Options "DENY" always;

        # Prevent caching sensitive pages
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # === PRIORITY 2: Admin Interface Protection ===
    location ~ ^/(manage|configure|computer|script|reload|scriptler|pluginManager|view/.*/configure)($|/) {
        limit_req zone=jenkins_general burst=20 nodelay;
        limit_req_status 429;

        # CRITICAL: Enable IP whitelist for admin access
        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Strict CSP for admin interface
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # Force secure cookies
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # === PRIORITY 3: Build Artifacts - HARDENED ===
    location ~ ^/job/.*/artifact/ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        # CRITICAL: Enable IP whitelist for artifacts
        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        # Dedicated logging for artifacts
        access_log /var/log/nginx/jenkins-artifacts.log jenkins_secure buffer=32k;

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # HARDENED CSP - Whitelist trusted CDNs only
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self';" always;

        # Hide Jenkins' own CSP to avoid conflicts
        proxy_hide_header Content-Security-Policy;

        # CRITICAL: Prevent cookie access from artifacts
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;

        # Prevent caching of artifacts
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Additional security for artifacts
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    # === PRIORITY 4: Workspace Files ===
    location ~ ^/job/.*/ws/ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        # CRITICAL: Enable IP whitelist
        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        access_log /var/log/nginx/jenkins-workspace.log jenkins_secure buffer=32k;

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Same hardened CSP as artifacts
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self';" always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # === PRIORITY 5: User Content Directory ===
    location /userContent/ {
        limit_req zone=jenkins_artifacts burst=50 nodelay;
        limit_req_status 429;

        # CRITICAL: Enable IP whitelist
        if ($allowed_ip = 0) {
            access_log /var/log/nginx/jenkins-security.log jenkins_security;
            return 403;
        }

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self';" always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Clear-Site-Data "cookies" always;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # === PRIORITY 6: Jenkins API ===
    location ~ ^/(api|crumbIssuer)/ {
        limit_req zone=jenkins_api burst=30 nodelay;
        limit_req_status 429;

        access_log /var/log/nginx/jenkins-api.log jenkins_secure buffer=32k;

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Strict CSP for API (no scripts)
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        # Force secure cookies
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";

        # CORS configuration for API
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # === PRIORITY 7: WebSocket Connections ===
    location ~ ^/(ws|computer/.*ws)/ {
        limit_req zone=jenkins_general burst=10 nodelay;
        limit_req_status 429;

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Security headers for WebSocket
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        proxy_buffering off;
    }

    # === PRIORITY 8: General Jenkins UI ===
    location / {
        limit_req zone=jenkins_general burst=20 nodelay;
        limit_req_status 429;

        # Proxy to Jenkins
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Moderate CSP for Jenkins UI
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' wss: ws:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # Force secure cookies
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax";

        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # === Custom Error Pages (No Information Leakage) ===
    error_page 403 /custom_403.html;
    error_page 404 /custom_404.html;
    error_page 429 /custom_429.html;
    error_page 500 502 503 504 /custom_50x.html;

    location = /custom_403.html {
        internal;
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><title>403 Forbidden</title><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px;background:#f5f5f5;color:#333}h1{color:#d32f2f;font-size:3em;margin:0}p{font-size:1.2em;color:#666}</style></head><body><h1>403</h1><p>Access Forbidden</p></body></html>';
    }

    location = /custom_404.html {
        internal;
        default_type text/html;
        return 404 '<!DOCTYPE html><html><head><title>404 Not Found</title><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px;background:#f5f5f5;color:#333}h1{color:#ff9800;font-size:3em;margin:0}p{font-size:1.2em;color:#666}</style></head><body><h1>404</h1><p>Page Not Found</p></body></html>';
    }

    location = /custom_429.html {
        internal;
        default_type text/html;
        return 429 '<!DOCTYPE html><html><head><title>429 Too Many Requests</title><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px;background:#f5f5f5;color:#333}h1{color:#f44336;font-size:3em;margin:0}p{font-size:1.2em;color:#666}</style></head><body><h1>429</h1><p>Too Many Requests - Please Try Again Later</p></body></html>';
    }

    location = /custom_50x.html {
        internal;
        default_type text/html;
        return 500 '<!DOCTYPE html><html><head><title>Service Error</title><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px;background:#f5f5f5;color:#333}h1{color:#9c27b0;font-size:3em;margin:0}p{font-size:1.2em;color:#666}</style></head><body><h1>Service Error</h1><p>Temporarily Unavailable - Please Try Again</p></body></html>';
    }
}

# ==========================================
# DEPLOYMENT VERIFICATION
# ==========================================
#
# After deployment, run these tests:
#
# 1. Configuration syntax:
#    nginx -t
#
# 2. Reload Nginx:
#    nginx -s reload
#
# 3. Verify Jenkins backend:
#    curl -I http://127.0.0.1:8080/
#
# 4. Test HTTPS:
#    curl -I https://your-domain.com/
#
# 5. Test rate limiting:
#    for i in {1..10}; do curl -I https://your-domain.com/login; done
#
# 6. Check logs:
#    tail -f /var/log/nginx/jenkins-access.log
#    tail -f /var/log/nginx/jenkins-security.log
#
# 7. External security scan:
#    - SSL Labs: https://www.ssllabs.com/ssltest/
#    - Security Headers: https://securityheaders.com/
#
# ==========================================
# MAINTENANCE
# ==========================================
#
# Regular tasks:
# - Monitor /var/log/nginx/*.log daily
# - Check fail2ban status: fail2ban-client status
# - Update SSL certificates before expiry
# - Review and update IP whitelist
# - Run security scans monthly
#
# ==========================================
# 1. 强制 HTTP 跳转 HTTPS (全站加密)
server {
    listen 80;
    server_name localhost;

    # 隐藏 Nginx 版本号，防止针对性漏洞探测
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 主配置
server {
    listen 443 ssl;
    # Nginx 1.29+ 开启 HTTP/2 的标准写法
    http2 on;
    server_name localhost;

    # 证书路径 (建议使用 ECDSA P-256 兼顾安全与兼容性)
    ssl_certificate /etc/nginx/certs/jenkins.crt;
    ssl_certificate_key /etc/nginx/certs/jenkins.key;

    # --- SSL/TLS 协议安全加固 ---
    # 彻底禁用旧版不安全协议 (TLS 1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    # 优先使用服务器端的强加密套件
    ssl_prefer_server_ciphers on;
    # 仅允许强加密算法，排除弱算法和 RSA 常规漏洞算法
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # 开启 SSL 会话缓存，提高性能
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- 深度隐私保护与安全响应头 (HSTS / CSP) ---
    # 开启 HSTS (有效期一年)，强制浏览器未来一年都必须通过 HTTPS 访问
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 防止点击劫持 (Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 开启浏览器 XSS 过滤
    add_header X-XSS-Protection "1; mode=block" always;
    # 隐私保护：不泄露 Referrer 来源地址
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 隐私保护：隐藏 Jenkins 暴露的版本响应头
    proxy_hide_header X-Jenkins;
    proxy_hide_header X-Hudson;
    proxy_hide_header X-Jenkins-Session;

    # 限制上传大小 (防止恶意大文件耗尽磁盘)
    client_max_body_size 50m;

    # --- 反向代理至 Jenkins Master ---
    location / {
        proxy_pass http://jenkins-master:8080;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 针对 Jenkins 反向代理的兼容性设置
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        proxy_buffering off;
        proxy_request_buffering off; # 允许大文件上传

        # 允许 Jenkins 进行分块传输编码
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 隐藏 Nginx 默认错误页面版本信息
    server_tokens off;
}
